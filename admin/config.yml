# Decap CMS configuration — Finance For Movement
# Editors sign in with their GitHub account (must have write access to the repo).
# Netlify acts as the OAuth provider (Site settings → Access & security → OAuth).

backend:
  name: github
  repo: sdatta25/finance-for-movement
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth
  commit_messages:
    update: "Update {{collection}} via website admin"
    uploadMedia: "Upload {{path}} via website admin"

# Uncomment while testing locally with `npx decap-server`:
# local_backend: true

media_folder: "images"
public_folder: "images"

site_url: /
logo_url: /images/logo.png

collections:
  - name: site
    label: "Site Content"
    files:
      - name: main
        label: "Homepage & General"
        file: content/site.json
        fields:
          - label: "Impact Stats"
            name: stats
            widget: list
            summary: "{{fields.number}} — {{fields.label}}"
            fields:
              - { label: "Number", name: number, widget: string, hint: "e.g. 14,000+" }
              - { label: "Label", name: label, widget: string }

          - label: "About Us page"
            name: about
            widget: object
            fields:
              - { label: "Intro (top of About page)", name: intro, widget: text }
              - { label: "Mission", name: mission, widget: text }
              - { label: "UN SDG Alignment text", name: sdg, widget: text }

          - label: "Upcoming Events"
            name: events
            widget: list
            summary: "{{fields.title}} ({{fields.month}} {{fields.day}})"
            fields:
              - { label: "Month (3 letters)", name: month, widget: string, hint: "e.g. SEP" }
              - { label: "Day", name: day, widget: string }
              - { label: "Event name", name: title, widget: string }
              - { label: "Details line", name: description, widget: string }

          - label: "Site Photos"
            name: images
            widget: object
            fields:
              - { label: "About section photo", name: about, widget: image }
              - label: "Gallery photos (In the Community)"
                name: gallery
                widget: list
                summary: "{{fields.image}}"
                fields:
                  - { label: "Photo", name: image, widget: image }
              - label: "Community posters (exactly 2, shown under testimonials)"
                name: posters
                widget: list
                min: 2
                max: 2
                summary: "{{fields.image}}"
                fields:
                  - { label: "Poster image", name: image, widget: image }

          - label: "Student Testimonials"
            name: testimonials
            widget: list
            summary: "{{fields.name}} ({{fields.grade}})"
            fields:
              - { label: "Quote", name: quote, widget: text }
              - { label: "Student name", name: name, widget: string }
              - { label: "Grade", name: grade, widget: string }

          - label: "Partners & Sponsors"
            name: partners
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: "Organization name", name: name, widget: string }
              - { label: "Logo (optional)", name: logo, widget: image, required: false, hint: "Leave blank to show the name as text" }
              - { label: "Website link (optional)", name: link, widget: string, required: false }

          - label: "Literacy Kits"
            name: literacyKits
            widget: object
            fields:
              - { label: "Intro paragraph", name: intro, widget: text }
              - label: "What's included"
                name: includes
                widget: list
                field: { label: "Item", name: item, widget: string }
              - { label: "Request form embed URL (optional)", name: formEmbedUrl, widget: string, required: false, hint: "Google Form link ending in ?embedded=true. Leave blank to show the email button." }

          - label: "FAQ"
            name: faq
            widget: list
            summary: "{{fields.question}}"
            fields:
              - { label: "Question", name: question, widget: string }
              - { label: "Answer", name: answer, widget: text }

          - label: "Contact & Links"
            name: contact
            widget: object
            fields:
              - { label: "Email", name: email, widget: string }
              - { label: "Instagram URL", name: instagram, widget: string }
              - { label: "TikTok URL", name: tiktok, widget: string }
